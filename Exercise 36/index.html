<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise #36</title>
    <style>
      #colorPreview {
        width: 200px;
        height: 200px;
        margin: 20px 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #colorHistory {
        list-style: none;
        padding: 0;
      }
      #colorHistory li {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <h1>Intersctive Color Picker</h1>
    <label for="colorPicker">Choose a Color: </label>
    <input type="color" name="color" id="colorPicker" />

    <div id="colorPreview">Color Preview:</div>

    <h2>Color Histroy:</h2>
    <ul id="colorHistory"></ul>

    <button id="clearHistoryButton">Clear History</button>
    <script src="./main.js"></script>
